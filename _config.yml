theme: jekyll-theme-cayman
plugins:
  - jekyll-default-layouts

# Proper index document resolution for directory-based navigation
index_file: index.html

# Set the base URL if needed for GitHub Pages subdirectory deployment
# baseurl: /NewGen

# Enable safe mode (important for GitHub Pages)
safe: true

# Include dotfiles in the build
include:
  - .well-known

# Exclude unnecessary files
exclude:
  - vendor
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - package.json
  - .DS_Store
  - start-newgen.bat
  - start-newgen.ps1
  - NewGen.code-workspace
  - NAVIGATION.md

# Markdown processor
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
